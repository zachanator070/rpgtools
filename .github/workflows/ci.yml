name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  ci-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - uses: actions/checkout@v3
    - name: Unit Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-unit
  ci-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - uses: actions/checkout@v3
    - name: Integration Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-integration
  ci-e2e-postgres:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - uses: actions/checkout@v3
    - name: End-to-End Postgres Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make --debug=v --trace ci-e2e-postgres
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: e2e-videos
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/cypress/videos
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: seed_logs
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/seed.log
  ci-e2e-sqlite:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: true
    steps:
    - uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - uses: actions/checkout@v3
    - name: End-to-End Sqlite Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-e2e-sqlite
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: e2e-videos
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/cypress/videos
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: seed_logs
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/seed.log
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: nohup_logs
        path: /home/runner/work/rpgtools/rpgtools/electron.log