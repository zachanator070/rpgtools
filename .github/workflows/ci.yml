name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  ci-unit:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Unit Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-unit
  ci-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Integration Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-integration
  ci-e2e-postgres:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - name: Checkout code
      uses: actions/checkout@v3
    - name: End-to-End Postgres Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-e2e-postgres
    - name: Upload Artifacts - Server Logs Postgres
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: server-logs-postgres
        path: /home/runner/work/rpgtools/rpgtools/artifacts/server-prod.log
    - name: Upload Artifacts - E2E Videos Postgres
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: e2e-videos-postgres
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/cypress/videos
    - name: Upload Artifacts - E2E Screenshots Postgres
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: seed-logs-postgres
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/seed.log
    - name: Upload Artifacts - E2E Screenshots Postgres
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: e2e-screenshots-postgres
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/cypress/screenshots
  ci-e2e-sqlite:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: true
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.17.0
    - name: Checkout code
      uses: actions/checkout@v3
    - name: End-to-End Sqlite Tests
      uses: GabrielBB/xvfb-action@v1
      with:
        run: make ci-e2e-sqlite
    - name: Upload Artifacts - E2E Videos Sqlite
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: e2e-videos-sqlite
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/cypress/videos
    - name: Upload Artifacts - Seed Logs Sqlite
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: seed-logs-sqlite
        path: /home/runner/work/rpgtools/rpgtools/packages/frontend/seed.log
    - name: Upload Artifacts - Nohup Logs
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: nohup-logs
        path: /home/runner/work/rpgtools/rpgtools/electron.log
  ci-version-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Version Check
      run: ./dev/scripts/check-version-bump.sh